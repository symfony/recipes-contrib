# DNS rebinding protection of symfony/mcp-bundle. Left unset it keeps the SDK default,
# which accepts only localhost, so a server reachable under its own domain answers every
# request with "403 Forbidden: Invalid Host header." after the OAuth handshake already
# succeeded, and without writing anything to the log. Hosts carry no port.
mcp:
    http:
        allowed_hosts:
            - '%env(key:host:url:SULU_MCP_SERVER_URL)%'
            - localhost
            - 127.0.0.1
            - '[::1]'
