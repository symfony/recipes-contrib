# VPS-only Compose overlay. CI / deploy/vps-release.sh adds this file so the
# host never rebuilds the image (assets were compiled in CI).
#
#   docker compose -f compose.yaml -f compose.prod.yaml -f deploy/compose.vps.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml -f deploy/compose.vps.yaml up -d --no-build

services:
    web:
        image: ${IMAGE:?Set IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG to the git SHA}
        pull_policy: always

    setup:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: always

    init-perm:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: always

    worker:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: always

    scheduler:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: always
