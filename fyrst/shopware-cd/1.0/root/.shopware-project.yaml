# fyrst.dev baseline for shopware-cli (build) + deployment-helper (deploy).
# Merge with the file generated by `shopware-cli project create` / `project config`.
# Configure only keys you use; unused sections can stay empty or omitted.
#
# https://developer.shopware.com/docs/products/tools/cli/project-commands/build.html
# https://developer.shopware.com/docs/guides/hosting/installation-updates/deployments/deployment-helper.html

# Date-based CLI/tooling behaviour (YYYY-MM-DD). Bump deliberately when you
# opt into newer shopware-cli defaults — do not advance it casually.
compatibility_date: '2026-02-11'

build:
    # Storefront browserslist. "defaults" drops legacy IE polyfills vs Shopware's stock list.
    browserslist: 'defaults'

    # Extra paths deleted after the CI build (vendor/node_modules are already cleaned
    # by `shopware-cli project ci`). Example:
    #   - 'tests'
    #   - 'custom/plugins/*/node_modules'
    cleanup_paths: []

    # Custom PHP bundles (classes extending Shopware\Core\Framework\Bundle).
    # Plugins/apps are auto-detected; bundles are not. Declare them here — do not
    # use legacy composer.json extra.shopware-bundles.
    # bundles:
    #   - path: src/MyBundle
    #   - path: src/MyFancyBundle
    #     name: MyGreatFancyBundle

    hooks:
        pre: []
        post-composer: []
        post: []
        # Also available: pre-composer, pre-assets, post-assets

# Deploy-time behaviour for vendor/bin/shopware-deployment-helper.
# Hooks are empty by default; add shell snippets per shop when needed.
# deployment:
#   hooks:
#     pre: []
#     post: []
#     pre-install: []
#     post-install: []
#     pre-update: []
#     post-update: []
#   extension-management:
#     enabled: true
#     exclude: []
#   store:
#     license-domain: ''   # TODO: shop hostname used for licensed apps, not a secret
